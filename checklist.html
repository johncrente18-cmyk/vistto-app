<style>

  .fbtn { display: flex; justify-content: center; align-items: center; gap: 8px; border-radius: 4px; padding: 7px 8px; font-size: 13px; font-weight: 700; background: transparent; border: 1px solid; }
  .fbtn svg { width: 15px; height: 15px; }

  .mbox { background: var(--surface); border-radius: var(--r); padding: 20px; width: min(560px, 100%); display: grid; gap: 12px; max-height: 90vh; overflow: auto; }

  .rk.Alto { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); } .rk.Médio { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); } .rk.Baixo { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .mchips { display: flex; gap: 6px; flex-wrap: wrap; }

<div id="app"></div>
<script src="supabase.js"></script>
<script>
(() => {
  const MOD_NOMES = { base: 'Itens de todas as inspeções', escavacao: 'Escavação', eletrica: 'Eletricidade', icamento: 'Içamento', carga: 'Movimentação de carga' };
  const TIPOS_PADRAO = [{ id: 'caminhada', nome: 'Caminhada de segurança', descricao: 'Ferramentas, EPI, documentação e os riscos da atividade do dia', usa_atividade: true, ordem: 1, ativo: true },
    { id: 'vivencia', nome: 'Área de vivência (Meta 01)', descricao: 'Documentação e estrutura da área de vivência', usa_atividade: false, ordem: 2, ativo: true }];
  const RESERVADOS = ['tipos', 'atividades', 'pessoas', 'historico'];
  const GRUPOS = [['veiculos', 'Inspeções de Veículos-Máquinas-Equipamentos'], ['gerencia', 'Inspeção Gerência'], ['campo', 'Inspeções de Campo TSTs']];
  const grupoDe = t => t.grupo || (t.id === 'caminhada' || t.id === 'vivencia' ? 'gerencia' : 'campo');
  const tipoDe = id => (S.tipos || []).find(t => t.id === id) || TIPOS_PADRAO.find(t => t.id === id) || { id, nome: id, usa_atividade: false };
  const ehForm = id => { const t = tipoDe(id); return t.modo === 'formulario' && t.estrutura && Array.isArray(t.estrutura.itens); };
  const nCampos = id => ehForm(id) ? tipoDe(id).estrutura.itens.reduce((a, it) => a + (it.subitens || []).length, 0) : 0;
  const usaAtiv = id => !ehForm(id) && !!tipoDe(id).usa_atividade;
  const $app = document.getElementById('app');
  const S = { sb: null, user: null, papel: null, itens: [], ativ: [], tipos: null, semTabelaTipos: false, tab: 'caminhada', status: 'ok', pend: 0, err: '', novoMod: '' };
  const timers = {};

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const modNome = m => MOD_NOMES[m] || (m.charAt(0).toUpperCase() + m.slice(1).replace(/-/g, ' '));
  const novoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
  function setStatus() {
    const el = document.getElementById('st'); if (!el) return;
    if (S.err) { el.className = 'pill bad'; el.textContent = 'Erro ao salvar'; el.title = S.err; }
    else if (S.pend > 0) { el.className = 'pill busy'; el.textContent = 'Salvando…'; el.title = ''; }
    else { el.className = 'pill ok'; el.textContent = 'Tudo salvo ✓'; el.title = 'Os celulares recebem as mudanças em até 30 segundos'; }
  }
  async function run(p) {
    S.pend++; S.err = ''; setStatus();
    try { const r = await p; if (r && r.error) throw r.error; return r; }
    catch (e) { S.err = e.message || String(e); toast('Não foi possível salvar: ' + S.err); throw e; }
    finally { S.pend--; setStatus(); }
  }

  // ---------- inicialização ----------
  async function boot() {
    let cfg;
    try { cfg = await (await fetch('config.json', { cache: 'no-store' })).json(); } catch (e) {}
    if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey) return fatal('Não encontrei o <code>config.json</code> com as chaves do banco.');
    const url = cfg.supabaseUrl.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/+$/, '');
    S.url = url; S.key = cfg.supabaseAnonKey;
    S.sb = window.supabase.createClient(url, cfg.supabaseAnonKey, { auth: { persistSession: true, storageKey: 'vistto_auth' } });
    const { data } = await S.sb.auth.getSession();
    if (data && data.session) { S.user = data.session.user; return entrar(); }
    telaLogin();
  }
  function fatal(html) { $app.innerHTML = `<div class="login"><div class="card"><h1>Editor do checklist</h1><div class="err">${html}</div></div></div>`; }

  function telaLogin(msg) {
    const emAnt = (document.getElementById('em') || {}).value || '';
    $app.innerHTML = `
      <div class="login"><form class="card" id="f">
        <div><h1>Painel Vistto</h1><div class="hint" style="margin:0">Entre com a mesma conta de administrador do app Vistto.</div></div>
        <input type="text" id="em" placeholder="E-mail ou usuário" autocomplete="username" autocapitalize="none" inputmode="email" required value="${esc(emAnt)}">
        <input type="password" id="pw" placeholder="Senha" autocomplete="current-password" required>
        ${msg ? `<div class="err">${msg}</div>` : ''}
        <button class="primary" id="go">Entrar</button>
      </form></div>`;
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const b = document.getElementById('go'); b.disabled = true; b.textContent = 'Entrando…';
      let em = document.getElementById('em').value.trim();
      if (em && !em.includes('@')) { const r = await S.sb.rpc('email_por_usuario', { p_usuario: em }); if (r.error || !r.data) return telaLogin('Usuário não encontrado.'); em = r.data; }
      const { data, error } = await S.sb.auth.signInWithPassword({ email: em, password: document.getElementById('pw').value });
      if (error) return telaLogin(/invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : esc(error.message));
      S.user = data.user; entrar();
    };
  }

  async function entrar() {
    $app.innerHTML = '<div class="login"><div class="hint">Carregando…</div></div>';
    const [p, it, at] = await Promise.all([
      S.sb.from('profiles').select('papel,nome,foto,email').eq('id', S.user.id).maybeSingle(),
      S.sb.from('checklist_itens').select('*').order('ordem'),
      S.sb.from('atividades').select('*').order('ordem'),
    ]);
    if (p.error || it.error || at.error) return fatal('Erro ao ler o banco: ' + esc((p.error || it.error || at.error).message));
    S.papel = p.data && p.data.papel; S.eu = p.data || {};
    if (S.papel !== 'admin') {
      return fatal(`A conta <b>${esc(S.user.email)}</b> não é administradora, então não pode alterar o checklist.<br><br>
        No Supabase › SQL Editor, rode:<br><code>update public.profiles set papel = 'admin' where email = '${esc(S.user.email)}';</code>
        <br><br><button class="ghost" onclick="location.reload()">Tentar de novo</button> <button class="ghost" id="out">Sair</button>`)
        || (document.getElementById('out').onclick = sair);
    }
    S.itens = it.data; S.ativ = at.data;
    const tp = await S.sb.from('tipos_inspecao').select('*').order('ordem');
    if (tp.error) { S.tipos = TIPOS_PADRAO.slice(); S.semTabelaTipos = true; } else S.tipos = tp.data.length ? tp.data : TIPOS_PADRAO.slice();
    try { const eq = await S.sb.from('equipamentos').select('*').order('prefixo'); S.equip = eq.error ? [] : eq.data; } catch (e) { S.equip = []; }
    const hm = location.hash.match(/^#insp=([0-9a-f-]{36})$/i);
    if (hm) { S.tab = 'historico'; render(); abrirRelatorio(hm[1]); return; }
    render();
  }
  async function sair() { await S.sb.auth.signOut(); location.reload(); }

  // ---------- tela principal ----------
  const ICON = {
    walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M7 21l3-6 2 2v4M10 15l1-5 3 3h3M8 12l3-2"/></svg>',
    tent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18L12 4z"/><path d="M12 4v16M9 20l3-6 3 6"/></svg>',

    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.2 4.6 1.9 5.3 4.9"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="9.5" r="3.6"/><path d="M5.6 19.2c1.3-3 3.6-4.5 6.4-4.5s5.1 1.5 6.4 4.5"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>',
    up: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></svg>' };

  function render() {
    const tps = [...S.tipos].sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const navT = t => [t.id, t.nome + (t.ativo === false ? ' (desativado)' : ''), t.id === 'caminhada' ? 'walk' : t.id === 'vivencia' ? 'tent' : 'clip'];
    const nav = [['Relatórios', [['historico', 'Histórico de inspeções', 'chart']]], ['Configuração', [['tipos', 'Tipos de inspeção', 'list'], ['atividades', 'Atividades e riscos', 'bolt']]], ['Pessoas', [['pessoas', 'Cadastro de pessoas', 'users']]],
      ...GRUPOS.slice().reverse().map(([g, l]) => ['Checklists · ' + l.replace('Inspeções de ', '').replace('Inspeção ', ''), tps.filter(t => grupoDe(t) === g).map(navT)]).filter(x => x[1].length)];
    $app.innerHTML = `
      <header>
        <div class="bar">
          <div class="brand">Vistto · Painel<small>${esc(S.user.email)}</small></div>
          <div class="grow"></div>
          <span id="st" class="pill ok"></span>
          <button class="ghost" id="sair">Sair</button>
        </div>
      </header>
      <div class="shell">
        <nav class="side" aria-label="Menu"><div class="me"><div class="av">${S.eu && S.eu.foto ? `<img src="${esc(S.eu.foto)}" alt="">` : esc(String((S.eu && S.eu.nome) || S.user.email).trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase())}</div><div style="min-width:0"><b>${esc((S.eu && S.eu.nome) || 'Sem nome')}</b><small>${esc(S.user.email)}</small><small>Perfil: ${esc({ admin: 'Administrador', supervisor: 'Supervisor', gestor: 'Gestor de obra', tecnico: 'Técnico de segurança', engenheiro: 'Engenheiro' }[S.papel] || S.papel || '—')}</small><small>Obra: UFV Paraíso</small></div></div>${nav.map(([g, its]) => `<h3>${g}</h3>` + its.map(([k, n, ic]) => `<button class="nav" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ICON[ic]}<span>${n}</span></button>`).join('')).join('')}</nav>
        <main class="wrap" id="main"></main>
      </div>`;
    document.getElementById('sair').onclick = sair;
    $app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
    setStatus();
    document.getElementById('main').classList.toggle('wide', ['tipos', 'pessoas', 'atividades'].includes(S.tab));
    if (S.tab === 'atividades') renderAtividades(); else if (S.tab === 'pessoas') renderPessoas(); else if (S.tab === 'tipos') renderTipos(); else if (S.tab === 'historico') renderHistorico(); else if (ehForm(S.tab)) renderForm(S.tab); else renderItens(S.tab);
  }

  function modulosDe(tipo) {
    const ms = new Set(S.itens.filter(i => i.tipo === tipo).map(i => i.modulo || 'base'));
    if (usaAtiv(tipo)) S.ativ.forEach(a => (a.modulos || []).forEach(m => ms.add(m)));
    ms.add('base');
    const ord = ['base', 'escavacao', 'eletrica', 'icamento', 'carga'];
    return [...ms].sort((a, b) => ((ord.indexOf(a) + 1 || 99) - (ord.indexOf(b) + 1 || 99)) || a.localeCompare(b));
  }

  function renderItens(tipo) {
    const main = document.getElementById('main');
    const mods = modulosDe(tipo);
    const secoes = [...new Set(S.itens.filter(i => i.tipo === tipo).map(i => i.secao).filter(Boolean))];
    const eqs = (S.equip || []).filter(e => e.tipo === tipo);
    let h = `<h1 style="font-size:22px;margin:22px 0 0">${esc(tipoDe(tipo).nome)}</h1>${eqs.length ? `<details class="group" style="padding:12px 16px"><summary style="cursor:pointer"><b>Máquinas cadastradas (${eqs.length})</b> <span class="hint">· escolhidas no cabeçalho da inspeção</span></summary><div class="chips" style="margin-top:10px">${eqs.map(e => `<span class="chip" style="cursor:default"><b>${esc(e.prefixo || '')}</b> ${esc(e.modelo || '')} · ${esc(e.serie || '')}</span>`).join('')}</div></details>` : ''}<p class="hint">As mudanças são salvas sozinhas e chegam aos celulares em até 30 segundos (ou na hora em que o app é aberto).
      ${usaAtiv(tipo) ? 'Os itens de um risco só aparecem nas subfrentes cuja atividade usa aquele risco (veja a aba <b>Atividades e riscos</b>).' : ''}</p>
      <datalist id="secs">${secoes.map(s => `<option value="${esc(s)}">`).join('')}</datalist>`;
    let n = 0;
    for (const m of mods) {
      const ativos = S.itens.filter(i => i.tipo === tipo && (i.modulo || 'base') === m && i.ativo !== false).sort((a, b) => a.ordem - b.ordem);
      const off = S.itens.filter(i => i.tipo === tipo && (i.modulo || 'base') === m && i.ativo === false);
      const usam = m === 'base' ? '' : S.ativ.filter(a => (a.modulos || []).includes(m)).map(a => a.nome).join(', ');
      h += `<section class="group">
        <div class="ghead"><h2>${esc(m === 'base' && !usaAtiv(tipo) ? 'Itens do checklist' : modNome(m))}</h2>${usaAtiv(tipo) && m !== 'base' ? `<span class="uses">${usam ? 'Usado em: ' + esc(usam) : 'Nenhuma atividade usa este risco ainda'}</span>` : ''}</div>
        ${ativos.map((i, k) => `
          <div class="item" data-id="${esc(i.id)}">
            <div class="num">${++n}</div>
            <div class="fields">
              <textarea rows="1" data-f="pergunta" aria-label="Pergunta">${esc(i.pergunta)}</textarea>
              <input type="text" class="sec" data-f="secao" list="secs" placeholder="Seção (ex.: EPI)" value="${esc(i.secao || '')}" aria-label="Seção">
            </div>
            <div class="acts">
              <button class="icon" data-mv="-1" title="Subir" ${k === 0 ? 'disabled' : ''}>↑</button>
              <button class="icon" data-mv="1" title="Descer" ${k === ativos.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="icon del" data-off title="Tirar do checklist">✕</button>
            </div>
          </div>`).join('')}
        <div class="add"><button class="ghost" data-add="${esc(m)}">+ Adicionar item</button></div>
        ${off.length ? `<details class="off"><summary>Itens retirados (${off.length})</summary>${off.map(i => `
          <div class="offrow" data-id="${esc(i.id)}"><span>${esc(i.pergunta)}</span><button class="ghost" data-on>Voltar ao checklist</button></div>`).join('')}</details>` : ''}
      </section>`;
    }
    if (usaAtiv(tipo)) h += `<section class="group"><div class="ghead"><h2>Novo risco</h2><span class="uses">Cria um grupo de itens para um risco novo (ex.: trabalho em altura)</span></div>
      <div class="add"><input type="text" id="nm" placeholder="Nome do risco" style="max-width:280px"><button class="ghost" id="nmb">Criar</button></div></section>`;
    main.innerHTML = h;

    main.querySelectorAll('textarea').forEach(autosize);
    main.querySelectorAll('.item [data-f]').forEach(el => {
      el.addEventListener('input', () => { if (el.tagName === 'TEXTAREA') autosize(el); agendar(el.closest('.item').dataset.id, el.dataset.f, el.value); });
    });
    main.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => mover(b.closest('.item').dataset.id, +b.dataset.mv));
    main.querySelectorAll('[data-off]').forEach(b => b.onclick = () => ativar(b.closest('.item').dataset.id, false));
    main.querySelectorAll('[data-on]').forEach(b => b.onclick = () => ativar(b.closest('.offrow').dataset.id, true));
    main.querySelectorAll('[data-add]').forEach(b => b.onclick = () => adicionar(tipo, b.dataset.add));
    const nmb = document.getElementById('nmb');
    if (nmb) nmb.onclick = () => {
      const nome = document.getElementById('nm').value.trim(); if (!nome) return;
      const m = slug(nome); if (!m) return;
      MOD_NOMES[m] = MOD_NOMES[m] || nome;
      adicionar(tipo, m, nome);
    };
  }

  function autosize(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }

  function agendar(id, campo, valor) {
    const it = S.itens.find(i => i.id === id); if (!it) return;
    it[campo] = valor;
    const k = id + campo;
    if (timers[k]) clearTimeout(timers[k]); else { S.pend++; setStatus(); }
    timers[k] = setTimeout(async () => {
      timers[k] = null; S.pend--;
      const v = campo === 'pergunta' ? valor.trim() : (valor.trim() || null);
      if (campo === 'pergunta' && !v) { setStatus(); return toast('A pergunta não pode ficar vazia.'); }
      await run(S.sb.from('checklist_itens').update({ [campo]: v }).eq('id', id)).catch(() => {});
    }, 700);
  }

  async function mover(id, dir) {
    const it = S.itens.find(i => i.id === id);
    const grupo = S.itens.filter(i => i.tipo === it.tipo && (i.modulo || 'base') === (it.modulo || 'base') && i.ativo !== false).sort((a, b) => a.ordem - b.ordem);
    const k = grupo.indexOf(it), outro = grupo[k + dir]; if (!outro) return;
    let [a, b] = [it.ordem, outro.ordem];
    if (a === b) b = a + dir;
    it.ordem = b; outro.ordem = a; render();
    await run(S.sb.from('checklist_itens').update({ ordem: it.ordem }).eq('id', it.id)).catch(() => {});
    await run(S.sb.from('checklist_itens').update({ ordem: outro.ordem }).eq('id', outro.id)).catch(() => {});
  }

  async function ativar(id, on) {
    const it = S.itens.find(i => i.id === id); it.ativo = on; render();
    if (!on) toast('Item retirado. Ele continua guardado nas inspeções antigas e pode voltar quando quiser.');
    await run(S.sb.from('checklist_itens').update({ ativo: on }).eq('id', id)).catch(() => { it.ativo = !on; render(); });
  }

  async function adicionar(tipo, modulo, secaoPadrao) {
    const grupo = S.itens.filter(i => i.tipo === tipo && (i.modulo || 'base') === modulo);
    const doTipo = S.itens.filter(i => i.tipo === tipo);
    const ordem = grupo.length ? Math.max(...grupo.map(i => i.ordem)) + 1 : (doTipo.length ? Math.max(...doTipo.map(i => i.ordem)) + 10 : 1);
    const ult = grupo.filter(i => i.ativo !== false).sort((a, b) => a.ordem - b.ordem).pop();
    const row = { id: novoId(tipo === 'caminhada' ? 'c' : tipo === 'vivencia' ? 'v' : 'i'), tipo, modulo, secao: (ult && ult.secao) || secaoPadrao || null, ordem, pergunta: 'Novo item, escreva a pergunta aqui', ativo: true };
    S.itens.push(row); render();
    const el = document.querySelector(`.item[data-id="${row.id}"] textarea`);
    if (el) { el.focus(); el.select(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    await run(S.sb.from('checklist_itens').insert(row)).catch(() => { S.itens = S.itens.filter(i => i !== row); render(); });
  }

  // ---------- atividades ----------

  // barra padrão das páginas em cartões: Novo · contador · paginação
  function barraCartoes(novoTxt, contTxt, pag, nPag) {
    const pgs = []; for (let k = 0; k < nPag; k++) if (k < 5 || k === nPag - 1 || Math.abs(k - pag) <= 1) pgs.push(k); else if (pgs[pgs.length - 1] !== '…') pgs.push('…');
    return `<div class="gbar"><button class="novo" id="gnovo">${novoTxt} <span style="font-size:18px;line-height:1">⊕</span></button><span class="cnt">${contTxt}</span>
      <div class="pag"><button data-pg="0" ${pag === 0 ? 'disabled' : ''} title="Primeira">|‹</button><button data-pg="${pag - 1}" ${pag === 0 ? 'disabled' : ''} title="Anterior">‹</button>
      ${pgs.map(k => k === '…' ? '<button disabled>…</button>' : `<button data-pg="${k}" ${k === pag ? 'aria-current="page"' : ''}>${k + 1}</button>`).join('')}
      <button data-pg="${pag + 1}" ${pag >= nPag - 1 ? 'disabled' : ''} title="Próxima">›</button><button data-pg="${nPag - 1}" ${pag >= nPag - 1 ? 'disabled' : ''} title="Última">›|</button></div></div>`;
  }
  function ligarPaginas(root, set) { root.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { if (b.disabled) return; set(+b.dataset.pg); window.scrollTo(0, 0); }); }
  function buscaViva(id, set) { const el = document.getElementById(id); el.oninput = () => { set(el.value); clearTimeout(timers[id]); timers[id] = setTimeout(() => { const x = document.getElementById(id); if (x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } }, 0); }; }
  S.ta = { q: '', risco: '', pag: 0 };
  function renderAtividades() {
    const main = document.getElementById('main'), A = S.ta, POR = 12;
    const mods = [...new Set(S.tipos.filter(t => t.usa_atividade).flatMap(t => modulosDe(t.id)))].filter(m => m !== 'base');
    const q = semAc(A.q).trim();
    const lista = [...S.ativ].sort((x, y) => (x.ordem || 0) - (y.ordem || 0)).filter(x => (!A.risco || x.risco === A.risco) && (!q || q.split(/\s+/).every(w => semAc(x.nome).includes(w))));
    const nPag = Math.max(1, Math.ceil(lista.length / POR)); if (A.pag >= nPag) A.pag = nPag - 1;
    const pagina = lista.slice(A.pag * POR, A.pag * POR + POR);
    const abas = [['', `Todas (${S.ativ.length})`]].concat(['Alto', 'Médio', 'Baixo'].map(r => [r, `Risco ${r.toLowerCase()} (${S.ativ.filter(x => x.risco === r).length})`]));
    main.innerHTML = `<div class="gtitle">Gestão de Atividades e Riscos</div>
      <p class="hint" style="text-align:center;margin:0 0 6px">Cada atividade define quais riscos entram na caminhada de segurança. A atividade de cada subfrente é escolhida no app.</p>
      <div class="ptabs" role="tablist">${abas.map(([k, l]) => `<button class="ptab" role="tab" data-aba="${k}" aria-selected="${A.risco === k}">${esc(l)}</button>`).join('')}</div>
      ${barraCartoes('Nova', `Atividades cadastradas: ${lista.length}${lista.length !== S.ativ.length ? ` de ${S.ativ.length}` : ''}`, A.pag, nPag)}
      <div class="gsearch" style="grid-template-columns:1fr"><input type="text" id="aq" placeholder="Procurar atividade" value="${esc(A.q)}"></div>

    main.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { A.risco = b.dataset.aba; A.pag = 0; renderAtividades(); });

  const PAPER_CSS = `body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1f2b;margin:24px;font-size:13px}h1{font-size:20px;text-align:center;margin:6px 0 4px}h2{font-size:15px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid #e3e5ee;text-transform:uppercase;letter-spacing:.04em}

  // ---------- relatório de uma inspeção ----------
  async function abrirRelatorio(id) {
    const ov = document.createElement('div'); ov.className = 'rep-ov'; ov.innerHTML = '<div class="rep-box"><div class="rep-bar"><h3>Carregando relatório…</h3><button class="ghost" data-x>Fechar</button></div></div>';
    document.body.appendChild(ov); const fechar = () => { ov.remove(); if (location.hash.startsWith('#insp=')) history.replaceState(null, '', location.pathname); };

      const [ir, nr] = await Promise.all([S.sb.from('inspecoes').select('*').eq('id', id).maybeSingle(), S.sb.from('ncs').select('*').eq('inspecao_id', id)]);

  const ST_NC = { aberta: 'Enviada ao líder', vista: 'Vista pelo líder', corrigida: 'Corrigida (aguardando validação)', encerrada: 'Encerrada' };

  function editarTipo(t) {

      ${fm ? '<div class="hint" style="margin:0">Modelo: <b>Formulário</b> (campos importados).</div>' : `<label class="check"><input type="checkbox" id="m_ativ" ${t && t.usa_atividade ? 'checked' : ''}> Soma os itens de risco da atividade do dia</label>`}
      <div class="acts2">${novo ? '' : `<button class="ghost" id="m_itens">${fm ? 'Ver formulário →' : 'Abrir itens do checklist →'}</button>`}<button class="ghost" id="m_x">Cancelar</button><button class="primary" id="m_ok">${novo ? 'Criar e montar o checklist' : 'Salvar'}</button></div>`,
    (box, fechar) => {
      box.querySelector('#m_x').onclick = fechar;

      box.querySelector('#m_ok').onclick = async () => {
        const nome = box.querySelector('#m_nome').value.trim(); if (!nome) return toast('Preencha o nome.');
        const desc = box.querySelector('#m_desc').value.trim() || null, grupo = box.querySelector('#m_grupo').value, ua = box.querySelector('#m_ativ');
        if (novo) {
          if (S.semTabelaTipos) return toast('Rode a migração 04 no Supabase antes de criar tipos novos.');
          let id = slug(nome) || novoId('t'); if (RESERVADOS.includes(id) || S.tipos.some(x => x.id === id)) id += '-' + Date.now().toString(36).slice(-4);
          const row = { id, nome, descricao: desc, usa_atividade: !!(ua && ua.checked), grupo, ordem: S.tipos.length ? Math.max(...S.tipos.map(x => x.ordem || 0)) + 1 : 1, ativo: true };
          fechar(); S.tipos.push(row); S.tab = id; render(); window.scrollTo(0, 0);

        } else {

  async function duplicarTipo(t) {

    const row = { id, nome, descricao: t.descricao || null, usa_atividade: !!t.usa_atividade, grupo: grupoDe(t), ordem: (t.ordem || 0) + 1, ativo: false, modo: t.modo || 'checklist', estrutura: t.estrutura || null };

  // ---------- pessoas ----------

  function campo(id, label, tipo = 'text', extra = '') {

          <label class="fl pw"><span>Confirme a senha *</span><input type="password" id="f_senha2" value="${esc(F.senha2)}" required minlength="6" autocomplete="new-password"></label>`}

    const keep = () => { ['nome', 'email', 'telefone', 'usuario', 'matricula', 'senha', 'senha2'].forEach(k => { const el = document.getElementById('f_' + k); if (el) F[k] = el.value; });

  function reduzir(file) {
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const L = 320, sz = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = L;
      c.getContext('2d').drawImage(img, (img.width - sz) / 2, (img.height - sz) / 2, sz, sz, 0, 0, L, L); res(c.toDataURL('image/jpeg', 0.82)); }; img.src = fr.result; }; fr.readAsDataURL(file); });
  }

  async function salvarPessoa() {
    const F = S.form, ed = !!F.id, err = m => { const el = document.getElementById('perr'); if (el) el.textContent = m; else toast(m); };
    F.nome = F.nome.trim(); F.email = F.email.trim().toLowerCase(); F.usuario = F.usuario.trim().toLowerCase(); F.matricula = F.matricula.trim(); F.telefone = soDig(F.telefone);
    if (!F.nome || !F.email || !F.usuario || !F.matricula || !F.telefone) return err('Preencha todos os campos com *.');
    if (!/^[a-z0-9._-]{3,}$/.test(F.usuario)) return err('Nome de usuário: use letras, números, ponto, hífen ou _, sem espaços (mínimo 3).');
    if (F.telefone.length < 10) return err('Telefone com DDD, por exemplo (67) 99999-0000.');
    if (S.people.some(p => p.id !== F.id && (p.usuario || '').toLowerCase() === F.usuario)) return err('Este nome de usuário já está em uso.');
    if (!ed && S.people.some(p => (p.email || '').toLowerCase() === F.email)) return err('Já existe uma pessoa com este e-mail.');
    if (S.people.some(p => p.id !== F.id && p.matricula && p.matricula === F.matricula)) return err('Esta matrícula já está cadastrada para outra pessoa.');
    if (!ed) { if (F.senha.length < 6) return err('A senha precisa de pelo menos 6 caracteres.'); if (F.senha !== F.senha2) return err('As senhas não conferem.'); }
    const btn = document.getElementById('salvar'); btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = { nome: F.nome, papel: F.papel, telefone: F.telefone, usuario: F.usuario, matricula: F.matricula, foto: F.foto || null };
    try {
      let id = F.id;
      if (!ed) {
        const tmp = window.supabase.createClient(S.url, S.key, { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'vistto_tmp' } });
        const r = await tmp.auth.signUp({ email: F.email, password: F.senha, options: { data: { nome: F.nome } } });
        if (r.error) throw new Error(/registered|exists/i.test(r.error.message) ? 'Já existe uma conta com este e-mail.' : /password/i.test(r.error.message) ? 'Senha fraca: use pelo menos 6 caracteres.' : r.error.message);
        if (!r.data.user || (r.data.user.identities && r.data.user.identities.length === 0)) throw new Error('Já existe uma conta com este e-mail.');
        id = r.data.user.id; try { await tmp.auth.signOut(); } catch (e) {}
      }
      const u = await run(S.sb.from('profiles').update(dados).eq('id', id).select());
      if (!u.data || !u.data.length) throw new Error('A conta foi criada, mas o perfil não apareceu ainda. Atualize a página e edite a pessoa na Busca.');
      const D = { nome: F.nome, email: F.email, usuario: F.usuario, senha: F.senha, tel: F.telefone, novo: !ed };
      await carregarPessoas();
      S.done = D; S.form = vazio(); if (!ed) S.form.enviar = F.enviar;
      renderPessoas(); window.scrollTo(0, 0);
      if (!ed && F.enviar) abrirEmail(D);
    } catch (e) { btn.disabled = false; btn.textContent = ed ? 'Salvar alterações' : 'Cadastrar'; err(e.message || String(e)); }
  }

  window.addEventListener('resize', () => document.querySelectorAll('textarea').forEach(autosize));
  window.addEventListener('beforeunload', e => { if (S.pend > 0) { e.preventDefault(); e.returnValue = ''; } });
  boot();
})();
</script>
</body>
</html>
